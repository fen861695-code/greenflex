name: Bug report
description: Report a reproducible defect without including sensitive content.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include prompts, responses, credentials, local paths, databases, or telemetry artifacts.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: GreenFlex version
    validations:
      required: true

