[project]
name = "greenflex"
version = "0.1.0"
description = "Local-first green inference ordering platform"
readme = "../README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
  "aiosqlite==0.22.1",
  "alembic==1.18.4",
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "nvidia-ml-py==13.590.48",
  "orjson==3.11.7",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "python-multipart==0.0.32",
  "sqlalchemy==2.0.51",
  "structlog==25.5.0",
  "uvicorn[standard]==0.42.0"
]

[dependency-groups]
dev = [
  "cyclonedx-bom==7.3.0",
  "mypy==1.19.1",
  "pip-audit==2.10.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.1.0",
  "respx==0.22.0",
  "ruff==0.15.5",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/greenflex"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["greenflex"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["greenflex"]

[tool.coverage.report]
fail_under = 80
show_missing = true
